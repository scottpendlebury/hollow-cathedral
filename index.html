<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <meta name="description" content="The Hollow Cathedral - a dark fantasy first-person shooter for the browser." />
    <title>The Hollow Cathedral</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0908;
        color: #d8d2c4;
        font-family: Georgia, 'Times New Roman', serif;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0908;
        z-index: 50;
        transition: opacity 0.6s ease;
        padding: 24px;
        text-align: center;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot .sigil {
        width: 68px;
        height: 68px;
        border: 1px solid #4a3a1c;
        border-radius: 50%;
        position: relative;
        animation: turn 7s linear infinite;
      }
      #boot .sigil::before,
      #boot .sigil::after {
        content: '';
        position: absolute;
        inset: 12px;
        border: 1px solid #2e2413;
        border-radius: 50%;
      }
      #boot .sigil::after {
        inset: 26px;
        background: #6b1414;
        box-shadow: 0 0 18px #7a1f1f;
      }
      @keyframes turn {
        to {
          transform: rotate(360deg);
        }
      }
      #boot h1 {
        margin: 0;
        font-size: clamp(18px, 4.2vw, 30px);
        font-weight: 400;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #b08d4a;
        text-indent: 0.42em;
      }
      #boot p {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.2em;
        color: #5d5749;
        text-transform: uppercase;
      }
      #boot .err {
        color: #a14545;
        max-width: 520px;
        font-size: 14px;
        letter-spacing: 0.02em;
        line-height: 1.6;
        text-transform: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-root"></div>
    <div id="boot">
      <div class="sigil"></div>
      <h1>The Hollow Cathedral</h1>
      <p id="boot-status">Kindling the dark&hellip;</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
